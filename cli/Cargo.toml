[package]
name = "sumi"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
clap = { version = "4", default-features = false, features = ["derive", "help", "std", "usage"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
